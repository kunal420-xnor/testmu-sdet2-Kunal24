name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type'
        default: 'all'
        type: choice
        options: [all, ui, api, integration, smoke]

env:
  BASE_URL:          https://www.saucedemo.com
  API_BASE_URL:      https://reqres.in/api
  STANDARD_USER:     standard_user
  STANDARD_PASSWORD: secret_sauce
  REQRES_API_KEY:    ${{ secrets.REQRES_API_KEY }}

jobs:
  test:
    name: Tests (Shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        total: [2]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run tests
        run: |
          CMD="npx playwright test --shard=${{ matrix.shard }}/${{ matrix.total }}"
          case "${{ github.event.inputs.test_type }}" in
            smoke)       CMD="$CMD --grep @smoke" ;;
            ui)          CMD="$CMD tests/ui" ;;
            api)         CMD="$CMD tests/api" ;;
            integration) CMD="$CMD tests/integration" ;;
          esac
          eval $CMD
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.shard }}
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

  merge-reports:
    name: Summary
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All shards completed
        run: echo "✅ All test shards finished. Check individual shard artifacts for reports."